  This HTML file is the entry point for the Tauri desktop app.

  Enjoy!
-->


<!DOCTYPE html>
<html lang="en">
  <head>


    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My-Pety</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="style.css" />


  </head>
  <body>

    
    <div id="setup-screen" class="modal">
      <div class="modal-content">
        <h2>Setup My-Pety</h2>
        <input id="setup-name" placeholder="Your name" />
        <input id="setup-pet-name" placeholder="Pet name" />
        <input id="setup-pet-type" placeholder="Pet type" />
        <input id="setup-api-key" placeholder="Hack Club API key" />
        <input id="setup-password" type="password" placeholder="Create password" />
        <button id="save-config">Save Setup</button>
        <p id="setup-status"></p>
      </div>
    </div>




    <!-- user login modal -->
    <div id="login-modal" class="modal">

      <div class="modal-content">

        <h2>Login to My-Pety</h2>
        <input type="password" placeholder="Enter password" id="login-password" />
        <button id="login-btn">Login</button>
        <p id="login-status"></p>
      </div>

    </div>


    
    <!-- main container -->
    <main class="stage" id="app" style="display: none;"> 
      <div class="titlebar" data-tauri-drag-region title="Drag window here">
        <span class="titlebar-dot"></span>
        <span class="titlebar-text">My-Pety</span>
        <span class="titlebar-pill">Drag window</span>
      </div>

      <!-- bubble shell -->
      <section class="bubble-shell" aria-label="Pet message panel">
        <div class="bubble-header">
          <span class="bubble-dot"></span>
          <span class="bubble-title">My-Pety</span>
          <span class="drag-pill">Message</span>
        </div>
        <h2 id="response">Ask something, open a site, or click the pet to wave.</h2>
      </section>
      
      <!-- my pety image -->
      <div class="pet" aria-label="Pet" title="Click pet to wave">
        <img src="assets/moxi-idle.gif" alt="Moxi pet" id="pet-image" />
      </div>
      
      <!-- Chatwindow -->
      <div class="chat">
        <label class="chat-label" for="input">Ask My-Pety</label>
        <div class="chat-row">
          <input type="text" placeholder="Try: time, open youtube, search rust" id="input" />
          <button id="submit">Send</button>
        </div>
      </div>


    </main>
    <script src="script.js"></script>
  </body>
</html>



<!-- end of file -->
