[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sysinfo = "0.32"
chrono = "0.4"
urlencoding = "2.1"
open = "5"
notify-rust = "4"
screenshots = "0.8"
image = "0.25"
base64 = "0.22"
regex = "1"
argon2 = "0.5"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = "z"     # "z" optimizes for smallest binary size; use "3" for maximum execution speed
lto = true          # Enable Link-Time Optimization (LTO) to optimize across all dependencies
codegen-units = 1   # Reduce parallel compilation units to 1 for more aggressive LLVM optimizations
panic = "abort"     # Remove stack unwinding code on panic, which reduces binary size
strip = true        # Automatically strip debug symbols from the compiled binary

